services:
  mongodb:
    image: mongo:7
    container_name: streaks-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: streaks-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017/habit_tracker
      JWT_SECRET: change-this-jwt-secret
      PORT: 5000
      HOST: 0.0.0.0
      NODE_ENV: production
    ports:
      - "5002:5000"

  frontend:
    build:
      context: ./frontend
    container_name: streaks-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo-data:
