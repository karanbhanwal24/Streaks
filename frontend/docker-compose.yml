services:
  postgres:
    image: postgres:16-alpine
    container_name: streaks-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: habit_tracker
      POSTGRES_USER: habit_tracker
      POSTGRES_PASSWORD: habit_tracker
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit_tracker -d habit_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../backend
    container_name: streaks-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://habit_tracker:habit_tracker@postgres:5432/habit_tracker
      JWT_SECRET: change-this-jwt-secret
      PORT: 5000
      HOST: 0.0.0.0
      NODE_ENV: production
    ports:
      - "5002:5000"

  frontend:
    build:
      context: .
    container_name: streaks-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
